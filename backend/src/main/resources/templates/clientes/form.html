<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cliente')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <div class="card">
        <h1 th:text="${id == null} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
        <form th:action="${id == null} ? @{/clientes} : @{/clientes/{i}(i=${id})}" th:object="${form}" method="post">
            <div class="alert alert-erro" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
            <div class="form-grid">
                <div>
                    <label for="nome">Nome</label>
                    <input type="text" th:field="*{nome}" maxlength="120">
                    <div class="campo-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" th:field="*{cpf}" maxlength="14" placeholder="000.000.000-00">
                    <div class="campo-erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                </div>
                <div>
                    <label for="telefone">Telefone</label>
                    <input type="text" th:field="*{telefone}" maxlength="20">
                    <div class="campo-erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                </div>
                <div>
                    <label for="email">E-mail</label>
                    <input type="email" th:field="*{email}" maxlength="120">
                    <div class="campo-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
            </div>
            <label for="endereco">Endereço</label>
            <input type="text" th:field="*{endereco}" maxlength="255">
            <div class="campo-erro" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}"></div>

            <div class="acoes">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a class="btn" th:href="@{/clientes}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
