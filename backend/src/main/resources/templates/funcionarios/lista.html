<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Funcionários')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="linha"><h1>Funcionários</h1>
    <a class="btn btn-primary" th:href="@{/funcionarios/novo}" sec:authorize="hasRole('ADMIN_MASTER')">Novo funcionário</a></div>
  <p class="muted">Cadastro de funcionários e gerenciamento de acesso reunidos neste módulo.</p>
  <div class="tabela"><table>
    <thead><tr><th>Nome</th><th>Cargo</th><th>Telefone</th><th>Situação</th><th>Login</th><th>Perfil</th><th>Ações</th></tr></thead>
    <tbody>
      <tr th:each="f : ${funcionarios}">
        <td th:text="${f.nome}">Nome</td>
        <td th:text="${f.cargo}">Cargo</td>
        <td th:text="${f.telefone}">Telefone</td>
        <td><span class="badge" th:classappend="${f.status.name() == 'ATIVO'} ? 'badge-ok' : 'badge-erro'" th:text="${f.status.rotulo}">Ativo</span></td>
        <td th:text="${f.usuario != null ? f.usuario.email : 'Sem conta (legado)'}">Login</td>
        <td th:text="${f.usuario == null ? '—' : (f.usuario.funcao.nome == 'ROLE_GERENTE' ? 'Gerente' : (f.usuario.funcao.nome == 'ROLE_MECANICO' ? 'Mecânico' : (f.usuario.funcao.nome == 'ROLE_ASSISTENTE_ADMINISTRATIVO' ? 'Assistente' : 'Antigo')))}">Perfil</td>
        <td><a class="btn btn-sm" th:href="@{/funcionarios/{i}/editar(i=${f.id})}">Editar / acesso</a></td>
      </tr>
      <tr th:if="${#lists.isEmpty(funcionarios)}"><td colspan="7" class="muted">Nenhum funcionário cadastrado.</td></tr>
    </tbody>
  </table></div>
</main>
</body>
</html>
