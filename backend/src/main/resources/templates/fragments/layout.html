<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Oficina'">Oficina</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header class="topbar" th:fragment="nav">
    <a class="brand" th:href="@{/}">Oficina Mecânica</a>
    <nav class="menu" sec:authorize="isAuthenticated()">
        <a th:href="@{/veiculos}">Veículos</a>
        <a th:href="@{/clientes}" sec:authorize="hasAnyRole('ADMIN_MASTER','GERENTE','ASSISTENTE_ADMINISTRATIVO')">Clientes</a>
        <a th:href="@{/funcionarios}" sec:authorize="hasAnyRole('ADMIN_MASTER','GERENTE')">Funcionários</a>
    </nav>
    <span class="spacer"></span>
    <a class="usuario" sec:authorize="isAuthenticated()" th:href="@{/minha-conta/senha}" title="Trocar minha senha" sec:authentication="name">usuario</a>
    <span class="badge" sec:authorize="isAuthenticated()" sec:authentication="principal.perfilRotulo">Perfil</span>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
        <button type="submit" class="btn btn-sm">Sair</button>
    </form>
</header>
<div th:fragment="flash" th:remove="tag">
    <div class="alert alert-ok" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-erro" th:if="${erro}" th:text="${erro}"></div>
</div>
<span th:fragment="statusVeiculo(v)" class="badge"
      th:classappend="${v.status.name().startsWith('AGUARDANDO') ? 'badge-alerta' : (v.status.name() == 'CONCLUIDO' or v.status.name() == 'ENTREGUE' ? 'badge-ok' : '')}"
      th:text="${v.status.rotulo}">status</span>
</body>
</html>
